name: Deploy API CORS Worker

on:
  workflow_dispatch:
    inputs:
      environments:
        description: "Comma-separated environments to deploy (development,staging,production)"
        required: true
        default: "staging,production"

  push:
    branches: [main]
    paths:
      - "CFWorkers/ApiCorsWorker/**"
      - ".github/workflows/deploy-api-cors.yml"

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set environment matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'matrix=["development"]' >> "$GITHUB_OUTPUT"
          else
            IFS=',' read -ra ENVS <<< "${{ github.event.inputs.environments }}"
            JSON=$(printf '%s\n' "${ENVS[@]}" | jq -R . | jq -s -c .)
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Trigger ADO Pipeline (${{ matrix.environment }})
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          RESPONSE=$(curl -sf -X POST \
            "https://dev.azure.com/uipath/BusinessApplications/_apis/pipelines/17960/runs?api-version=7.1" \
            -H "Authorization: Basic $(echo -n ":$ADO_PAT" | base64 -w 0)" \
            -H "Content-Type: application/json" \
            -d "{
              \"templateParameters\": {
                \"environmentName\": \"${{ matrix.environment }}\",
                \"cloudFlareAccountId\": \"$CF_ACCOUNT_ID\"
              }
            }")

          RUN_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "### CF Worker Deploy - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- ADO Pipeline Run ID: $RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "- [View Run](https://uipath.visualstudio.com/BusinessApplications/_build/results?buildId=$RUN_ID)" >> $GITHUB_STEP_SUMMARY
