name: Publish SDK package

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Simulate SDK publish
        run: |
          echo "## [TEST] SDK Publish Simulated" >> $GITHUB_STEP_SUMMARY
          echo "Skipping real publish steps — testing cross-job trigger only." >> $GITHUB_STEP_SUMMARY

  trigger-cf-worker:
    needs: publish-sdk
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger API CORS Worker deploy (staging + production)
        env:
          GH_TOKEN: ${{ secrets.APPS_DEV_TOOLS_PAT }}
        run: |
          gh workflow run deploy-api-cors.yml \
            --repo ninja-shreyash/cherrypick-test \
            --field environments="staging,production"

          echo "### CF Worker Deploy Triggered" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered deploy-api-cors.yml in ninja-shreyash/cherrypick-test" >> $GITHUB_STEP_SUMMARY
          echo "- Environments: staging, production" >> $GITHUB_STEP_SUMMARY
          echo "- [View Runs](https://github.com/ninja-shreyash/cherrypick-test/actions/workflows/deploy-api-cors.yml)" >> $GITHUB_STEP_SUMMARY
